---
- name: API Call
  ansible.builtin.uri: 
    url: https://networkcalc.com/api/ip/{{ subnet }}/{{ mask }}
    return_content: yes
    validate_certs: no
  register: result
- name: Assignable Hosts
  set_fact:
      assignable_hosts_count: "{{ result.json.address.assignable_hosts }}"
- name: First Address
  set_fact:
    first_ip: "{{ result.json.address.first_assignable_host }}"
- name: Subnet Mask - Decimal
  set_fact:
   mask_decimal: "{{ result.json.address.subnet_mask }}"
- name: Subnet Mask - CIDR Notation
  set_fact:
    mask_cidr: "/{{ result.json.address.subnet_bits }}"
- name: Print Results
  debug:
    msg: 
      - "There are {{  assignable_hosts_count }} assignable hosts for the {{ subnet }}/{{ mask }} subnet"
      - "The first address is {{ first_ip }}"
      - "The subnet mask in decimal form is {{ mask_decimal }}"
      - "The subnet mask in cidr notation is {{ mask_cidr }}"
